aid: upscale-ai
name: Upscale AI
description: 'Upscale AI is a pure-play AI networking infrastructure company headquartered
  in Santa Clara, California, founded by industry veterans from Palo Alto Networks,
  Marvell, Cisco, and Google and led by CEO Barun Kar. The company builds a full-stack,
  open-standards AI fabric spanning silicon, systems, and software — its SkyHammer
  scale-up ASIC architecture and NVIDIA Spectrum-X/SONiC-based scale-out Ethernet
  systems connect accelerators, memory, and storage for large-scale AI training and
  inference. Backed by Mayfield among others (Premji Invest, NVIDIA, Salesforce Ventures,
  Temasek, Tiger Global), it has raised $500M total at a $2B valuation. The company
  publishes no public API, developer portal, or machine-readable interface surface
  beyond a Webflow-served llms.txt; it sells networking hardware and software evaluated
  by hyperscalers and neoclouds.'
